document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

y:'Space Grotesk',sans-serif;background:#EDEDEB;min-height:100vh;color:#191918;-webkit-font-smoothing:antialiased;\">\n\n<sc-if value=\"{{isLanding}}\" hint-placeholder-val=\"{{true}}\">\n<div style=\"display:flex;flex-direction:column;min-height:100vh;\">\n  <div style=\"display:flex;align-items:center;justify-content:space-between;padding:20px 40px;border-bottom:1px solid #C7C7C3;position:sticky;top:0;background:#EDEDEB;z-index:5;\">\n    <div style=\"display:flex;align-items:center;gap:40px;\">\n      <div sc-camel-on-click=\"{{ goHome }}\" style=\"font:500 16px 'JetBrains Mono';letter-spacing:0.08em;cursor:pointer;\">OSTRO<\u002Fdiv>\n      <div style=\"display:flex;gap:26px;\">\n        <span sc-camel-on-click=\"{{ scrollFeatures }}\" style=\"font:400 13px 'Space Grotesk';color:#7A7A76;cursor:pointer;\" style-hover=\"color:#191918;\">Features<\u002Fspan>\n        <span sc-camel-on-click=\"{{ scrollHow }}\" style=\"font:400 13px 'Space Grotesk';color:#7A7A76;cursor:pointer;\" style-hover=\"color:#191918;\">How it works<\u002Fspan>\n        <span sc-camel-on-click=\"{{ scrollPricing }}\" style=\"font:400 13px 'Space Grotesk';color:#7A7A76;cursor:pointer;\" style-hover=\"color:#191918;\">Pricing<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:18px;\">\n      <span sc-camel-on-click=\"{{ goProjects }}\" style=\"font:400 13px 'Space Grotesk';color:#7A7A76;cursor:pointer;\" style-hover=\"color:#191918;\">Log in<\u002Fspan>\n      <button sc-camel-on-click=\"{{ goProjects }}\" style=\"font:500 13px 'Space Grotesk';background:#FF4D00;color:#FFFFFF;border:none;padding:10px 18px;border-radius:5px;cursor:pointer;\" style-hover=\"background:#e64500;\">Sign up<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;flex-wrap:wrap;gap:56px;align-items:center;justify-content:space-between;padding:76px 40px 64px;max-width:1220px;margin:0 auto;width:100%;\">\n    <div style=\"flex:1 1 420px;min-width:280px;\">\n      <div style=\"font:500 11px 'JetBrains Mono';color:#7A7A76;letter-spacing:0.1em;margin-bottom:20px;display:flex;align-items:center;gap:10px;\"><span style=\"width:6px;height:6px;background:#FF4D00;border-radius:1px;\"><\u002Fspan>REC.01 — EDITING INSTRUMENT<\u002Fdiv>\n      <h1 style=\"font:400 50px/1.08 'Space Grotesk';margin:0 0 22px;letter-spacing:-0.015em;\">Three editing directions for every photo you shoot.<\u002Fh1>\n      <p style=\"font:400 16px/1.65 'Space Grotesk';color:#7A7A76;margin:0 0 20px;max-width:460px;\">Upload a photo and the system analyzes its content, then proposes three stylistically distinct edits — previewed on your actual image. Pick one, refine it in the editor, export at full resolution.<\u002Fp>\n      <div style=\"font:400 11px 'JetBrains Mono';color:#7A7A76;letter-spacing:0.04em;margin-bottom:30px;\">TRAINED ON 25,000 EXPERT EDITS · MIT-ADOBE FIVEK<\u002Fdiv>\n      <div style=\"display:flex;gap:12px;margin-bottom:36px;\">\n        <button sc-camel-on-click=\"{{ goProjects }}\" style=\"font:500 14px 'Space Grotesk';background:#FF4D00;color:#FFFFFF;border:none;padding:14px 28px;border-radius:6px;cursor:pointer;\" style-hover=\"background:#e64500;\">Start free<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ goProjects }}\" style=\"font:500 14px 'Space Grotesk';background:transparent;color:#191918;border:1px solid #C7C7C3;padding:14px 28px;border-radius:6px;cursor:pointer;\" style-hover=\"background:#E0E0DD;\">See demo<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:32px;border-top:1px solid #C7C7C3;padding-top:22px;\">\n        <div><div style=\"font:500 22px 'JetBrains Mono';\">3<\u002Fdiv><div style=\"font:400 11px 'JetBrains Mono';color:#7A7A76;letter-spacing:0.04em;\">EDITS / PHOTO<\u002Fdiv><\u002Fdiv>\n        <div><div style=\"font:500 22px 'JetBrains Mono';\">11<\u002Fdiv><div style=\"font:400 11px 'JetBrains Mono';color:#7A7A76;letter-spacing:0.04em;\">PARAMETERS<\u002Fdiv><\u002Fdiv>\n        <div><div style=\"font:500 22px 'JetBrains Mono';\">RAW<\u002Fdiv><div style=\"font:400 11px 'JetBrains Mono';color:#7A7A76;letter-spacing:0.04em;\">FULL RESOLUTION<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"flex:1 1 440px;min-width:300px;\">\n      <div style=\"background:#E0E0DD;border:1px solid #C7C7C3;border-radius:8px;padding:20px;position:relative;\">\n        <div style=\"position:absolute;top:12px;right:14px;font:500 9px 'JetBrains Mono';color:#7A7A76;letter-spacing:0.08em;\">PREVIEW<\u002Fdiv>\n        <div style=\"font:500 10px 'JetBrains Mono';color:#7A7A76;letter-spacing:0.06em;margin-bottom:12px;\">ORIGINAL<\u002Fdiv>\n        <div class=\"ph grain\" style=\"width:100%;height:200px;border-radius:5px;display:flex;align-items:flex-end;padding:12px;\">\n          <img src=\"01e3a2d2-9b83-4324-af24-07a300527942\" alt=\"\">\n          <span style=\"font:400 10px 'JetBrains Mono';color:#EDEAE4;position:relative;z-index:2;background:rgba(22,22,21,0.5);padding:3px 6px;border-radius:3px;\">ALPINE_RIDGE.RAW · 6048×4024<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:center;justify-content:center;gap:8px;margin:14px 0;\">\n          <div style=\"flex:1;height:1px;background:#C7C7C3;\"><\u002Fdiv>\n          <span style=\"font:400 10px 'JetBrains Mono';color:#7A7A76;\">3 DIRECTIONS ↓<\u002Fspan>\n          <div style=\"flex:1;height:1px;background:#C7C7C3;\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;\">\n          <div class=\"ph\" style=\"height:90px;border-radius:4px;display:flex;align-items:flex-end;padding:7px;\"><img src=\"c5d9f45e-682c-449d-a8f9-1eca8aa38450\" alt=\"\" style=\"filter:brightness(1.16) saturate(1.28) sepia(0.1);\"><span style=\"font:500 8px 'JetBrains Mono';color:#fff;position:relative;z-index:2;\">GOLDEN<\u002Fspan><\u002Fdiv>\n          <div class=\"ph\" style=\"height:90px;border-radius:4px;display:fl RE<\u002Fdiv>\n          <div style=\"position:absolute;bottom:12px;right:12px;font:400 10px 'JetBrains Mono';color:#EDEAE4;z-index:3;background:rgba(22,22,21,0.5);padding:3px 6px;border-radius:3px;\">AFTER<\u002Fdiv>\n          <div sc-camel-on-mouse-down=\"{{ startDividerDrag }}\" style=\"position:absolute;top:0;bottom:0;left:{{beforeAfterPos}}%;width:2px;background:#FF5A1F;cursor:ew-resize;z-index:4;\">\n            <div style=\"position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:20px;height:20px;background:#FF5A1F;border-radius:3px;display:flex;align-items:center;justify-content:center;font:500 10px 'JetBrains Mono';color:#fff;\">⇄<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:none;border-top:1px solid #33312F;padding:8px 20px;display:flex;justify-content:space-between;\">\n        <span style=\"font:400 11px 'JetBrains Mono';color:#A6A29C;\">4032 × 3024 · ZOOM 100%<\u002Fspan>\n        <span style=\"font:400 11px 'JetBrains Mono';color:#A6A29C;\">All changes saved<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"width:300px;flex:none;border-left:1px solid #33312F;overflow-y:auto;padding:18px 20px;\">\n      <sc-for list=\"{{sliderGroups}}\" as=\"group\" hint-placeholder-count=\"3\">\n        <div style=\"margin-bottom:22px;\">\n          <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;\">\n            <span style=\"font:500 11px 'Space Grotesk';color:#EDEAE4;letter-spacing:0.05em;\">{{group.title}}<\u002Fspan>\n            <span style=\"font:400 9px 'JetBrains Mono';color:#7A7A76;\">{{group.tag}}<\u002Fspan>\n          <\u002Fdiv>\n          <sc-for list=\"{{group.params}}\" as=\"param\" hint-placeholder-count=\"2\">\n            <div sc-camel-on-double-click=\"{{ param.reset }}\" style=\"padding:8px 0;border-bottom:1px solid #211F1E;\">\n              <div style=\"display:flex;justify-content:space-between;margin-bottom:7px;\">\n                <span style=\"font:400 12px 'Space Grotesk';color:#EDEAE4;\">{{param.label}}<\u002Fspan>\n                <span style=\"font:500 12px 'JetBrains Mono';color:#A6A29C;\">{{param.display}}<\u002Fspan>\n              <\u002Fdiv>\n              <div sc-camel-on-mouse-down=\"{{ param.startDrag }}\" style=\"position:relative;height:4px;background:#2B2A28;border-radius:2px;cursor:pointer;\">\n                <div style=\"position:absolute;left:0;top:0;bottom:0;width:{{param.percent}}%;background:#FF5A1F;border-radius:2px;\"><\u002Fdiv>\n                <div style=\"position:absolute;top:50%;left:{{param.percent}}%;width:10px;height:15px;background:{{param.thumbColor}};transform:translate(-50%,-50%);border-radius:2px;\"><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n\n      <div>\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;\">\n          <span style=\"font:500 11px 'Space Grotesk';color:#EDEAE4;letter-spacing:0.05em;\">TONE CURVE<\u002Fspan>\n          <span style=\"font:400 9px 'JetBrains Mono';color:#7A7A76;\">CURVE<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"height:150px;border:1px solid #33312F;border-radius:4px;background:#211F1E;position:relative;overflow:hidden;\">\n          <svg width=\"100%\" height=\"100%\" sc-camel-view-box=\"0 0 100 100\" sc-camel-preserve-aspect-ratio=\"none\">\n            <line x1=\"25\" y1=\"0\" x2=\"25\" y2=\"100\" stroke=\"#2B2A28\" stroke-width=\"0.5\"><\u002Fline>\n            <line x1=\"50\" y1=\"0\" x2=\"50\" y2=\"100\" stroke=\"#2B2A28\" stroke-width=\"0.5\"><\u002Fline>\n            <line x1=\"75\" y1=\"0\" x2=\"75\" y2=\"100\" stroke=\"#2B2A28\" stroke-width=\"0.5\"><\u002Fline>\n            <line x1=\"0\" y1=\"100\" x2=\"100\" y2=\"0\" stroke=\"#33312F\" stroke-width=\"1\"><\u002Fline>\n            <path d=\"M0,100 C 30,84 62,24 100,0\" stroke=\"#FF5A1F\" stroke-width=\"1.5\" fill=\"none\"><\u002Fpath>\n          <\u002Fsvg>\n          <div style=\"position:absolute;left:30%;top:16%;width:6px;height:6px;background:#FF5A1F;border-radius:50%;transform:translate(-50%,-50%);\"><\u002Fdiv>\n          <div style=\"position:absolute;left:62%;top:76%;width:6px;height:6px;background:#FF5A1F;border-radius:50%;transform:translate(-50%,-50%);\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{isExporting}}\">\n    <div style=\"position:absolute;inset:0;background:rgba(11,11,10,0.72);display:flex;align-items:center;justify-content:center;z-index:20;\">\n      <div style=\"width:400px;max-width:90vw;background:#211F1E;border:1px solid #33312F;border-radius:8px;padding:24px;\">\n        <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;\">\n          <span style=\"font:500 11px 'JetBrains Mono';color:#EDEAE4;letter-spacing:0.08em;\">EXPORT<\u002Fspan>\n          <span style=\"font:400 10px 'JetBrains Mono';color:#7A7A76;\">{{exportJobId}}<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"ph grain\" style=\"height:150px;border-radius:5px;margin-bottom:18px;\"><img src=\"92ef00fe-c0a3-42d3-919f-4347ec5fe0c9\" alt=\"\" style=\"filter:{{afterFilter}};\"><\u002Fdiv>\n        <sc-if value=\"{{exportRendering}}\" hint-placeholder-val=\"{{true}}\">\n          <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:12px;\">\n            <div style=\"width:14px;height:14px;border:2px solid #33312F;border-top-color:#FF5A1F;border-radius:50%;animation:spin 0.8s linear infinite;\"><\u002Fdiv>\n            <span style=\"font:400 13px 'Space Grotesk';color:#EDEAE4;\">Rendering full resolution…<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"height:4px;background:#2B2A28;border-radius:2px;overflow:hidden;margin-bottom:8px;\"><div style=\"height:100%;background:#FF5A1F;animation:bar 1.8s ease-out forwards;\"><\u002Fdiv><\u002Fdiv>\n          <div style=\"font:400 10px 'JetBrains Mono';color:#7A7A76;\">JOB QUEUED · 6048 × 4024 · JPEG q100<\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{exportDone}}\" hint-placeholder-val=\"{{false}}\">\n          <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:16px;\">\n            <span style=\"width:14px;height:14px;border-radius:50%;background:#3DAA6D;display:flex;align-items:center;justify-content:center;font:500 9px 'JetBrains Mono';color:#161615;\">✓<\u002Fspan>\n            <span style=\"font:400 13px 'Space Grotesk';color:#EDEAE4;\">Export ready — ALPINE_RIDGE_V04.jpg · 24.8 MB<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:10px;\">\n            <button style=\"flex:1;font:500 13px 'Space Grotesk';background:#FF5A1F;color:#fff;border:none;padding:11px;border-radius:5px;cursor:pointer;\" style-hover=\"background:#e64f19;\">Download<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ closeExport }}\" style=\"font:400 13px 'Space Grotesk';background:transparent;color:#EDEAE4;border:1px solid #33312F;padding:11px 18px;border-radius:5px;cursor:pointer;\" style-hover=\"background:#2B2A28;\">Close<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst PARAM_DEFS = {\n  temperature: { label: 'Temperature', min: -100, max: 100, dec: 0 },\n  tint: { label: 'Tint', min: -100, max: 100, dec: 0 },\n  exposure: { label: 'Exposure', min: -5, max: 5, dec: 2 },\n  contrast: { label: 'Contrast', min: -100, max: 100, dec: 0 },\n  highlights: { label: 'Highlights', min: -100, max: 100, dec: 0 },\n  shadows: { label: 'Shadows', min: -100, max: 100, dec: 0 },\n  whites: { label: 'Whites', min: -100, max: 100, dec: 0 },\n  blacks: { label: 'Blacks', min: -100, max: 100, dec: 0 },\n  saturation: { label: 'Saturation', min: -100, max: 100, dec: 0 },\n  vibrance: { label: 'Vibrance', min: -100, max: 100, dec: 0 }\n};\nconst GROUPS = [\n  { title: 'WHITE BALANCE', tag: 'WB', ids: ['temperature', 'tint'] },\n  { title: 'TONE', tag: 'TONE', ids: ['exposure', 'contrast', 'highlights', 'shadows', 'whites', 'blacks'] },\n  { title: 'COLOR', tag: 'COLOR', ids: ['saturation', 'vibrance'] }\n];\nconst DEFAULT_PARAMS = { temperature: 0, tint: 0, exposure: 0, contrast: 0, highlights: 0, shadows: 0, whites: 0, blacks: 0, saturation: 0, vibrance: 0 };\nconst REC_DEFS = [\n  { tag: 'WARMER · BRIGHTER', name: 'Golden Hour', params: 'TEMP +14 · EXP +0.35 · SAT +8', filter: 'brightness(1.18) saturate(1.26) sepia(0.1)', preset: { temperature: 14, exposure: 0.35, saturation: 8, shadows: 16, contrast: 8 } },\n  { tag: 'COOLER · HIGH CONTRAST', name: 'Nordic', params: 'TEMP −10 · CONTR +22 · BLACKS +12', filter: 'contrast(1.3) brightness(0.94) saturate(0.88) hue-rotate(-6deg)', preset: { temperature: -10, contrast: 22, blacks: 12, exposure: 0.1 } },\n  { tag: 'NATURAL · SOFT', name: 'Documentary', params: 'EXP +0.10 · SAT −6 · SHADOWS +16', filter: 'brightness(1.04) saturate(0.82) contrast(0.97)', preset: { exposure: 0.1, saturation: -6, shadows: 16, contrast: -4 } }\n];\nconst __R = (typeof window !== 'undefined' && window.__resources) || {};\n  const IMG = (id, w, h) => __R['proj' + id] || `https://picsum.photos/id/${id}/${w}/${h}`;\nconst SEED_PROJECTS = [\n  { id: 1, name: 'Alpine Ridge', tag: 'MOUNTAINS', versions: 3, lastEdit: '2h ago', img: IMG(1018, 480, 300) },\n  { id: 2, name: 'Pine Valley', tag: 'FOREST', versions: 5, lastEdit: 'Yesterday', img: IMG(1039, 480, 300) },\n  { id: 3, name: 'River Bend', tag: 'LANDSCAPE', versions: 2, lastEdit: '3 days ago', img: IMG(1015, 480, 300) },\n  { id: 4, name: 'Morning Fog', tag: 'VALLEY', versions: 4, lastEdit: '1 week ago', img: IMG(1043, 480, 300) }\n];\nconst SEED_VERSIONS = [\n  { id: 1, label: 'V01', params: { ...DEFAULT_PARAMS, temperature: 8, exposure: 0.2, contrast: 12, shadows: 15 } },\n  { id: 2, label: 'V02', params: { ...DEFAULT_PARAMS, temperature: 14, exposure: 0.35, contrast: 18, shadows: 24, vibrance: 8 } },\n  { id: 3, label: 'V03', params: { ...DEFAULT_PARAMS, temperature: -6, exposure: 0.3, contrast: 22, shadows: 20, saturation: -6 } }\n];\n\nclass Component extends DCLogic {\n  state = {\n    screen: 'landing',\n    projects: [...SEED_PROJECTS],\n    forceEmpty: false,\n    params: { ...SEED_VERSIONS[1].params },\n    history: [],\n    future: [],\n    dragging: null,\n    beforeAfterPos: 50,\n    versions: SEED_VERSIONS.map(v => ({ ...v, params: { ...v.params } })),\n    currentVersionId: 2,\n    exportStatus: null\n  };\n\n  goProjects = () => this.setState({ screen: 'projects' });\n  goHome = () => { this.setState({ screen: 'landing' }); requestAnimationFrame(() => window.scrollTo({ top: 0, behavior: 'smooth' })); };\n\n  setHowRef = (el) => { this.howEl = el; };\n  setFeatureRef = (el) => { this.featureEl = el; };\n  setPricingRef = (el) => { this.pricingEl = el; };\n  scrollToEl(el) { if (!el) return; const y = el.getBoundingClientRect().top + window.scrollY - 68; window.scrollTo({ top: y, behavior: 'smooth' }); }\n  scrollFeatures = () => this.scrollToEl(this.featureEl);\n  scrollHow = () => this.scrollToEl(this.howEl);\n  scrollPricing = () => this.scrollToEl(this.pricingEl);\n  toggleEmpty = () => this.setState(s => ({ forceEmpty: !s.forceEmpty }));\n\n  freshVersions() { return SEED_VERSIONS.map(v => ({ ...v, params: { ...v.params } })); }\n\n  uploadPhoto = () => {\n    const n = this.state.projects.length + 1;\n    const project = { id: Date.now(), name: 'Project ' + String(n).padStart(2, '0'), tag: 'NEW', versions: 1, lastEdit: 'now', img: IMG(1018, 480, 300) };\n    this.setState({ projects: [project, ...this.state.projects], forceEmpty: false, screen: 'recommendations' });\n  };\n\n  openProject = (p) => this.setState({ screen: 'editor', projectName: p.name, versions: this.freshVersions(), currentVersionId: 2, params: { ...SEED_VERSIONS[1].params }, history: [], future: [], exportStatus: null });\n\n  enterEditor = (preset, name) => {\n    const params = { ...DEFAULT_PARAMS, ...(preset || {}) };\n    this.setState({ screen: 'editor', projectName: name, params, versions: this.freshVersions(), currentVersionId: null, history: [], future: [], exportStatus: null });\n  };\n  selectRecommendation = (idx) => this.enterEditor(REC_DEFS[idx].preset, this.state.projects[0] ? this.state.projects[0].name : 'New project');\n  skipRecommendations = () => this.enterEditor(null, this.state.projects[0] ? this.state.projects[0].name : 'New project');\n\n  setPhotoFrameRef = (el) => { this.photoFrameEl = el; };\n\n  format(id, v) {\n    const d = PARAM_DEFS[id];\n    const s = v > 0 ? '+' : '';\n    return s + v.toFixed(d.dec);\n  }\n\n  pushHistory() {\n    this.setState(s => ({ history: [...s.history.slice(-24), { ...s.params }], future: [] }));\n  }\n\n  startDrag = (id, e) => {\n    e.preventDefault();\n    const d = PARAM_DEFS[id];\n    const rect = e.currentTarget.getBoundingClientRect();\n    this.pushHistory();\n    this.setState({ dragging: id });\n    const update = (clientX) => {\n      let pct = (clientX - rect.left) / rect.width;\n      pct = Math.max(0, Math.min(1, pct));\n      let val = d.min + pct * (d.max - d.min);\n      val = d.dec ? Math.round(val * 100) / 100 : Math.round(val);\n      this.setState(st => ({ params: { ...st.params, [id]: val } }));\n    };\n    update(e.clientX);\n    const onMove = (ev) => update(ev.clientX);\n    const onUp = () => {\n      this.setState({ dragging: null });\n      document.removeEventListener('mousemove', onMove);\n      document.removeEventListener('mouseup', onUp);\n    };\n    document.addEventListener('mousemove', onMove);\n    document.addEventListener('mouseup', onUp);\n  };\n\n  resetParam = (id) => {\n    this.setState(s => ({ history: [...s.history.slice(-24), { ...s.params }], future: [], params: { ...s.params, [id]: 0 } }));\n  };\n\n  undo = () => this.setState(s => {\n    if (!s.history.length) return null;\n    const prev = s.history[s.history.length - 1];\n    return { params: prev, history: s.history.slice(0, -1), future: [...s.future, s.params] };\n  });\n  redo = () => this.setState(s => {\n    if (!s.future.length) return null;\n    const next = s.future[s.future.length - 1];\n    return { params: next, future: s.future.slice(0, -1), history: [...s.history, s.params] };\n  });\n\n  selectVersion = (v) => this.setState({ params: { ...v.params }, currentVersionId: v.id, history: [], future: [] });\n  saveVersion = () => this.setState(s => {\n    const n = s.versions.length + 1;\n    const v = { id: Date.now(), label: 'V' + String(n).padStart(2, '0'), params: { ...s.params } };\n    return { versions: [...s.versions, v], currentVersionId: v.id };\n  });\n\n  startExport = () => {\n    this.setState({ exportStatus: 'rendering' });\n    clearTimeout(this._exportTimer);\n    this._exportTimer = setTimeout(() => this.setState({ exportStatus: 'done' }), 1900);\n  };\n  closeExport = () => this.setState({ exportStatus: null });\n\n  startDividerDrag = (e) => {\n    e.preventDefault();\n    const el = this.photoFrameEl;\n    if (!el) return;\n    const rect = el.getBoundingClientRect();\n    const update = (clientX) => {\n      let pct = ((clientX - rect.left) / rect.width) * 100;\n      this.setState({ beforeAfterPos: Math.max(0, Math.min(100, pct)) });\n    };\n    const onMove = (ev) => update(ev.clientX);\n    const onUp = () => {\n      document.removeEventListener('mousemove', onMove);\n      document.removeEventListener('mouseup', onUp);\n    };\n    document.addEventListener('mousemove', onMove);\n    document.addEventListener('mouseup', onUp);\n  };\n\n  renderVals() {\n    const s = this.state;\n    const showEmpty = s.forceEmpty || s.projects.length === 0;\n    const projects = s.projects.map(p => ({\n      ...p,\n      versionsLabel: p.versions + (p.versions === 1 ? ' VERSION' : ' VERSIONS'),\n      open: () => this.openProject(p)\n    }));\n\n    const sliderGroups = GROUPS.map(g => ({\n      title: g.title, tag: g.tag,\n      params: g.ids.map(id => {\n        const d = PARAM_DEFS[id];\n        const value = s.params[id];\n        return {\n          id, label: d.label, value,\n          display: this.format(id, value),\n          percent: ((value - d.min) / (d.max - d.min)) * 100,\n          thumbColor: s.dragging === id ? '#FF5A1F' : '#EDEAE4',\n          startDrag: (e) => this.startDrag(id, e),\n          reset: () => this.resetParam(id)\n        };\n      })\n    }));\n\n    const versions = s.versions.map(v => {\n      const active = v.id === s.currentVersionId;\n      return {\n        label: v.label,\n        bg: active ? '#2B2A28' : '#211F1E',\n        border: active ? '#FF5A1F' : '#33312F',\n        color: active ? '#EDEAE4' : '#A6A29C',\n        select: () => this.selectVersion(v)\n      };\n    });\n    const activeVersion = s.versions.find(v => v.id === s.currentVersionId);\n\n    const p = s.params;\n    const bright = Math.pow(2, p.exposure * 0.22) * (1 + p.shadows / 500 - p.highlights / 900 + p.blacks / 1100);\n    const contrast = Math.max(0.4, 1 + p.contrast / 160 + p.whites / 900);\n    const sat = Math.max(0, 1 + (p.saturation + p.vibrance * 0.7) / 160);\n    const sepia = p.temperature > 0 ? p.temperature / 300 : 0;\n    const hue = p.temperature < 0 ? p.temperature / 12 : p.tint / 18;\n    const afterFilter = `brightness(${bright.toFixed(3)}) contrast(${contrast.toFixed(3)}) saturate(${sat.toFixed(3)}) sepia(${sepia.toFixed(3)}) hue-rotate(${hue.toFixed(1)}deg)`;\n\n    const nextVer = String(s.versions.length + 1).padStart(2, '0');\n\n    return {\n      isLanding: s.screen === 'landing',\n      isProjects: s.screen === 'projects',\n      isRecommendations: s.screen === 'recommendations',\n      isEditor: s.screen === 'editor',\n      goProjects: this.goProjects,\n      goHome: this.goHome,\n      scrollFeatures: this.scrollFeatures,\n      scrollHow: this.scrollHow,\n      scrollPricing: this.scrollPricing,\n      setHowRef: this.setHowRef,\n      setFeatureRef: this.setFeatureRef,\n      setPricingRef: this.setPricingRef,\n      uploadPhoto: this.uploadPhoto,\n      skipRecommendations: this.skipRecommendations,\n      toggleEmpty: this.toggleEmpty,\n      emptyToggleLabel: showEmpty ? 'SHOW PROJECTS' : 'SHOW EMPTY',\n      hasProjects: !showEmpty,\n      isEmptyState: showEmpty,\n      projects,\n      projectCountLabel: projects.length + (projects.length === 1 ? ' PROJECT' : ' PROJECTS'),\n      howItWorks: [\n        { n: '01', title: 'Upload', desc: 'Drop a photo in any common format, or RAW. The system reads scene, light, and subject.' },\n        { n: '02', title: 'Choose a direction', desc: 'Get three stylistically distinct edits, each previewed on your own photo.' },\n        { n: '03', title: 'Refine & export', desc: 'Fine-tune in the dark editor, compare before/after, and export at full resolution.' }\n      ],\n      recs: REC_DEFS.map((r, i) => ({ ...r, select: () => this.selectRecommendation(i) })),\n      projectName: s.projectName || (s.projects[0] ? s.projects[0].name : 'Project 01'),\n      currentVersionLabel: activeVersion ? activeVersion.label : 'DRAFT',\n      undoOpacity: s.history.length > 0 ? 1 : 0.4,\n      redoOpacity: s.future.length > 0 ? 1 : 0.4,\n      undo: this.undo,\n      redo: this.redo,\n      versions,\n      saveVersion: this.saveVersion,\n      setPhotoFrameRef: this.setPhotoFrameRef,\n      beforeAfterPos: s.beforeAfterPos,\n      afterFilter,\n      startDividerDrag: this.startDividerDrag,\n      sliderGroups,\n      isExporting: s.exportStatus !== null,\n      exportRendering: s.exportStatus === 'rendering',\n      exportDone: s.exportStatus === 'done',\n      exportJobId: 'JOB #4F2A · V' + nextVer,\n      startExport: this.startExport,\n      closeExport: this.closeExport\n    };\n  }\n}\n<\u002Fscript>\n
