# PhotoAssistant — local environment.
#
# Run from the repository root:
#   docker compose --env-file .env -f infra/docker-compose.yml up -d postgres minio
#
# Phase 0 defines the storage layer only. The api, ml and frontend services are
# added in task 12 of docs/phases/phase-0.md.
#
# Every value comes from the root .env file (copy .env.example). No credentials
# or ports are hard-coded here.

name: photoassistant

services:
  postgres:
    image: pgvector/pgvector:0.8.5-pg18-trixie
    container_name: photoassistant-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      # Postgres 18+ stores data in a major-version subdirectory
      # (/var/lib/postgresql/18/docker), so the volume mounts one level up.
      # Mounting /var/lib/postgresql/data — correct up to Postgres 17 — makes
      # the container refuse to start. See docker-library/postgres#1259.
      - pgdata:/var/lib/postgresql
      # Runs only when the data directory is empty, i.e. on a fresh volume.
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # $$ keeps the variable for the container shell instead of letting
      # Compose interpolate it at parse time.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio:
    # Pinned to the last published community release. Upstream entered
    # maintenance mode in December 2025 and the repository was archived in
    # 2026; see ADR-15. Storage sits behind an S3 abstraction (ADR-12), so
    # replacing this service is a configuration change.
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: photoassistant-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_PORT}:9000"      # S3 API
      - "${MINIO_CONSOLE_PORT}:9001"  # object browser
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # One-shot: creates the buckets, then exits. Idempotent — re-running the
  # stack does not fail on buckets that already exist.
  createbuckets:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: photoassistant-createbuckets
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/$${S3_BUCKET_ORIGINALS} &&
      mc mb --ignore-existing local/$${S3_BUCKET_DERIVATIVES} &&
      mc mb --ignore-existing local/$${S3_BUCKET_EXPORTS} &&
      mc ls local
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET_ORIGINALS: ${S3_BUCKET_ORIGINALS}
      S3_BUCKET_DERIVATIVES: ${S3_BUCKET_DERIVATIVES}
      S3_BUCKET_EXPORTS: ${S3_BUCKET_EXPORTS}

volumes:
  pgdata:
  miniodata:
