# nginx serves the built SPA and is the only publicly reachable entry point.
#
# There is deliberately NO route to the ml service. nginx sits on the compose
# network and is exposed to the outside, so a single location block pointing at
# ml:8000 would make the internal service public and bypass the .NET API
# entirely. Adding one requires an ADR — see .claude/rules/ml_service.md.

server {
    listen 80;

    # Also listen on IPv6. Inside the container `localhost` resolves to ::1
    # first, and without this line anything addressing it by name — the health
    # check included — gets connection refused while the site is perfectly up.
    listen [::]:80;

    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The API is reached by service name on the compose network. The browser
    # only ever sees the relative path /api, which is why the production
    # environment file carries no host name.
    location /api/ {
        proxy_pass http://api:8080/api/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Full-resolution uploads and exports are large; the default 1 MB limit
        # would reject a photograph outright.
        client_max_body_size 64m;

        # Export rendering can take a while before the first byte arrives.
        proxy_read_timeout 300s;
    }

    location /health {
        proxy_pass http://api:8080/health;
        proxy_set_header Host $host;
    }

    # Build artefacts carry a content hash in the file name (main-JY5KJPC5.js),
    # so a changed file is a different name and the old one can be cached for
    # good.
    location ~* \.(?:js|css|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # /assets/ is NOT hashed — the translation files keep the same name
    # (assets/i18n/en.json). Caching them as immutable would mean a corrected
    # translation never reaches anyone who had already loaded the page.
    location /assets/ {
        expires 5m;
        try_files $uri =404;
    }

    # Client-side routing: an unknown path is a route inside the application,
    # not a missing file. Without this, reloading /projects returns 404.
    location / {
        try_files $uri $uri/ /index.html;

        # index.html itself must never be cached, or a deployed change would not
        # reach a returning visitor.
        add_header Cache-Control "no-cache";
    }
}
